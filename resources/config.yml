---
# Prefix of messages.
prefix: "&f[&6Calculator&f]&r"

# {prefix} : Prefix.
# {result} : The result of the math.
result: "{prefix} &aResult: &b{result}"

# {prefix} : Prefix.
# {error} : Error information.
error: "{prefix} &cError: {error}"

# playSound: true > A sound will be sent to the player when a math expressions is performed.
playSound: true

# showDataType: true > The data type will be displayed with the result.
showDataType: true

# Number of seconds allowed to answer variable prompts.
variableTimeoutSeconds: 60

# Messages used when an expression contains variables.
# {prefix} : Prefix.
# {variable} : Variable name.
# {error} : Error information.
variablePrompt: "{prefix} &eEnter a value for variable &b{variable}&e. Type &bcancel&e to cancel."
variableInvalid: "{prefix} &cInvalid value for &b{variable}&c: {error}"
variableCancelled: "{prefix} &cCalculator session cancelled."
variableTimedOut: "{prefix} &cCalculator session timed out."
...
